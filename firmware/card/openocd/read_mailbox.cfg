# Only loaded by an explicitly enabled live reader. No programming/flash operations.
adapter driver ftdi
ftdi_vid_pid 0x0403 0x6011
ftdi_channel 0
ftdi_layout_init 0x0098 0x008b
reset_config none
adapter speed 1000
gdb_port disabled
if {![info exists bridge_tcl_port]} {set bridge_tcl_port disabled}
tcl_port $bridge_tcl_port
telnet_port disabled
jtag newtap xc7 tap -irlen 6 -expected-id 0x0362d093
init
