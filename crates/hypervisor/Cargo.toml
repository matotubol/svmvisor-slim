[package]
name = "svmvisor-hypervisor"
version.workspace = true
edition.workspace = true

[[bin]]
name = "svmvisor-hypervisor"
path = "src/main.rs"
test = false
bench = false

[lib]
path = "src/lib.rs"

[dependencies]
svmvisor-card-abi = { path = "../card-abi" }
x86_64.workspace = true

[target.'cfg(not(target_os = "none"))'.dependencies]
uefi-raw = "0.15.1"

[features]
# Resident runtime selected only for the freestanding build stage.
resident-runtime = []
# Offline stopped-VMCB experiment primitives; no callable runtime interface.
svm-entry-trial = []

